name: Mini Data Platform CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── 1. Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install flake8 black

      - name: flake8 (style + syntax)
        run: flake8 dags/ data_generator/ --max-line-length=100

      - name: black (formatting check)
        run: black --check dags/ data_generator/

  # ── 2. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build all services
        run: docker compose build

  # ── 3. Integration test ──────────────────────────────────────────────────────
  integration-test:
    name: End-to-end data flow
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Start full stack
        run: docker compose up -d

      - name: Wait for Airflow webserver to be healthy
        run: |
          echo "Waiting for Airflow..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health | grep -q '"healthy"'; then
              echo "Airflow is up"; break
            fi
            echo "  attempt $i/30 – sleeping 10s"
            sleep 10
          done

      - name: Wait for MinIO to be healthy
        run: |
          for i in $(seq 1 12); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is up"; break
            fi
            sleep 5
          done

      # ── Step 1: Ingestion ──────────────────────────────────────────────────
      - name: Generate and upload data to MinIO
        run: |
          pip install pandas numpy minio
          MINIO_ENDPOINT=localhost:9000 python data_generator/generate.py

      - name: Verify file landed in MinIO bucket
        run: |
          pip install minio
          python - <<'EOF'
          from minio import Minio
          client = Minio("localhost:9000", access_key="minio", secret_key="minio123", secure=False)
          objects = list(client.list_objects("sales-data", recursive=True))
          assert len(objects) > 0, "No files found in MinIO bucket!"
          print(f"MinIO check passed: {len(objects)} file(s) found")
          for o in objects:
              print(f"  - {o.object_name} ({o.size} bytes)")
          EOF

      # ── Step 2: Processing ─────────────────────────────────────────────────
      - name: Trigger Airflow DAG
        run: |
          docker exec airflow_webserver airflow dags trigger mini_data_pipeline

      - name: Wait for DAG run to complete
        run: |
          echo "Polling DAG run status..."
          for i in $(seq 1 20); do
            STATE=$(docker exec airflow_webserver airflow dags state mini_data_pipeline $(date +%Y-%m-%dT%H:%M:%S) 2>/dev/null || echo "running")
            echo "  attempt $i – state: $STATE"
            if echo "$STATE" | grep -q "success"; then
              echo "DAG completed successfully"; break
            elif echo "$STATE" | grep -q "failed"; then
              echo "DAG run FAILED"; exit 1
            fi
            sleep 15
          done

      # ── Step 3: Storage validation ─────────────────────────────────────────
      - name: Verify rows loaded into PostgreSQL
        run: |
          docker exec postgres_db psql -U admin -d analytics -c "
            SELECT COUNT(*) AS row_count FROM sales;
          " | grep -E '[0-9]+' | awk '{print "Rows in sales table: "$1}'

          ROW_COUNT=$(docker exec postgres_db psql -U admin -d analytics -t -c "SELECT COUNT(*) FROM sales;")
          echo "Row count: $ROW_COUNT"
          if [ "$ROW_COUNT" -lt 1 ]; then
            echo "ERROR: No rows found in postgres.sales!"; exit 1
          fi
          echo "PostgreSQL check passed: $ROW_COUNT rows"

      # ── Step 4: Metabase API check ─────────────────────────────────────────
      - name: Wait for Metabase to be ready
        run: |
          for i in $(seq 1 24); do
            if curl -sf http://localhost:3000/api/health | grep -q '"status":"ok"'; then
              echo "Metabase is up"; break
            fi
            echo "  attempt $i/24 – sleeping 10s"
            sleep 10
          done

      - name: Metabase API health check
        run: |
          HEALTH=$(curl -sf http://localhost:3000/api/health)
          echo "Metabase health response: $HEALTH"
          echo "$HEALTH" | grep -q '"status":"ok"' || (echo "Metabase not healthy!"; exit 1)

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Airflow webserver logs ===" && docker logs airflow_webserver --tail 50 || true
          echo "=== Airflow scheduler logs ===" && docker logs airflow_scheduler --tail 50 || true
          echo "=== Postgres logs ===" && docker logs postgres_db --tail 30 || true
          echo "=== MinIO logs ===" && docker logs minio_storage --tail 20 || true

      - name: Tear down
        if: always()
        run: docker compose down -v